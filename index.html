<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#f0e6d6;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-family:'Inter',sans-serif;
  overflow:hidden;
  position:relative;
}
.bg-text{
  position:fixed;
  font-family:'Playfair Display',serif;
  font-weight:700;font-style:italic;
  color:rgba(160,50,40,.08);
  font-size:clamp(200px,40vw,500px);
  line-height:.85;z-index:0;pointer-events:none;
  user-select:none;text-align:center;
  top:50%;left:50%;transform:translate(-50%,-50%);
  white-space:nowrap;
}
.bg-text span{display:block}
.top-section{
  position:relative;z-index:2;text-align:center;
  margin-bottom:30px;opacity:0;
  animation:fadeDown .8s ease .3s forwards;
}
@keyframes fadeDown{
  from{opacity:0;transform:translateY(-20px)}
  to{opacity:1;transform:translateY(0)}
}
.top-section h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(1rem,2.5vw,1.3rem);
  font-weight:700;letter-spacing:8px;
  text-transform:uppercase;color:#3a1c1c;margin-bottom:2px;
}
.top-section h1 .red{color:#c0392b}
.top-section h2{
  font-family:'Playfair Display',serif;
  font-size:clamp(.7rem,1.5vw,.85rem);
  font-weight:400;letter-spacing:6px;
  text-transform:uppercase;color:#6a4a4a;margin-bottom:18px;
}
.envelope-scene{
  position:relative;z-index:2;cursor:pointer;
  filter:drop-shadow(0 25px 50px rgba(80,15,10,.35));
  transform:rotate(-4deg);
  animation:envFloat 3.5s ease-in-out infinite;
}
@keyframes envFloat{
  0%,100%{transform:translateY(0) rotate(-4deg)}
  50%{transform:translateY(-15px) rotate(1deg)}
}
.envelope-scene:hover{filter:drop-shadow(0 30px 60px rgba(80,15,10,.45))}
.env-shadow{
  width:clamp(200px,35vw,280px);height:18px;
  background:radial-gradient(ellipse,rgba(0,0,0,.1),transparent 70%);
  border-radius:50%;margin:0 auto;position:relative;z-index:1;
  animation:shadowPulse 3.5s ease-in-out infinite;
}
@keyframes shadowPulse{
  0%,100%{transform:scaleX(1);opacity:.7}
  50%{transform:scaleX(.8);opacity:.4}
}
.envelope-svg{width:clamp(280px,50vw,380px);height:auto}
.hint{
  position:relative;z-index:2;margin-top:20px;
  font-family:'Cormorant Garamond',serif;
  font-size:.9rem;color:#8a6a5a;opacity:0;
  animation:fadeDown .6s ease 1.5s forwards, pulse 2.5s ease-in-out 2s infinite;
}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.9}}
.thread{
  position:fixed;z-index:1;pointer-events:none;
  opacity:0;animation:fadeDown .8s ease 1s forwards;
}
.music-btn{
  position:fixed;bottom:20px;left:20px;z-index:150;
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#c0392b,#e74c3c);
  border:none;color:#fff;font-size:1.2rem;cursor:pointer;
  box-shadow:0 4px 15px rgba(192,57,43,.35);
  animation:musicPulse 2s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
}
.music-btn:hover{transform:scale(1.1)}
@keyframes musicPulse{
  0%,100%{box-shadow:0 4px 15px rgba(192,57,43,.35)}
  50%{box-shadow:0 4px 25px rgba(192,57,43,.55)}
}
.music-btn.paused{
  background:#8a6a5a;animation:none;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}
.overlay{
  position:fixed;inset:0;z-index:100;
  background:rgba(40,12,8,.45);backdrop-filter:blur(16px);
  display:none;align-items:center;justify-content:center;
  padding:20px;opacity:0;transition:opacity .5s;
}
.overlay.show{display:flex;opacity:1}
.letter{
  max-width:620px;width:95%;border-radius:4px;padding:0;
  box-shadow:0 25px 80px rgba(0,0,0,.25);
  transform:scale(.85) rotate(2deg);
  transition:transform .6s cubic-bezier(.34,1.56,.64,1),opacity .5s;
  opacity:0;position:relative;overflow:hidden;max-height:90vh;
  background:
    radial-gradient(ellipse at 20% 80%,rgba(210,180,140,.3),transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(220,190,150,.25),transparent 50%),
    radial-gradient(ellipse at 50% 50%,rgba(240,220,195,.2),transparent 70%),
    #f5e6d0;
  border:2px solid #e0cdb5;
}
.overlay.show .letter{transform:scale(1) rotate(0deg);opacity:1}
.letter::before{
  content:'';position:absolute;inset:0;
  box-shadow:inset 0 0 60px rgba(160,120,70,.15);
  pointer-events:none;border-radius:4px;
}
.letter-tape{
  width:80px;height:28px;margin:-2px auto 0;position:relative;z-index:2;
  background:rgba(230,210,170,.6);border:1px solid rgba(200,170,120,.3);
  border-radius:2px;transform:rotate(-2deg);
  box-shadow:0 1px 3px rgba(0,0,0,.06);
  background-image:
    radial-gradient(circle 1.5px at 15px 8px,#c0392b .8px,transparent .8px),
    radial-gradient(circle 1.5px at 35px 15px,#e74c3c .8px,transparent .8px),
    radial-gradient(circle 1px at 55px 10px,#c0392b .6px,transparent .6px),
    radial-gradient(circle 1.5px at 25px 20px,#d4956a .8px,transparent .8px),
    radial-gradient(circle 1px at 65px 18px,#e74c3c .6px,transparent .6px),
    radial-gradient(circle 1px at 10px 16px,#d4956a .6px,transparent .6px);
  background-color:rgba(230,210,170,.55);
}
.letter-content{
  padding:30px 35px 40px;overflow-y:auto;
  max-height:calc(90vh - 30px);
}
.letter .close{
  position:absolute;top:10px;right:14px;
  background:none;border:none;font-size:1.2rem;color:#b09a80;
  cursor:pointer;transition:color .3s;z-index:3;
}
.letter .close:hover{color:#c0392b}
.doodle{position:absolute;pointer-events:none;z-index:1}
@media(max-width:600px){
  .bg-text{font-size:150px}
  .top-section{margin-bottom:20px;padding:0 15px}
  .top-section h1{font-size:.9rem;letter-spacing:5px}
  .top-section h2{font-size:.65rem;letter-spacing:4px}
  .envelope-svg{width:260px}
  .env-shadow{width:180px}
  .letter-content{padding:22px 22px 35px}
  .letter-tape{width:65px;height:22px}
  .hint{font-size:.8rem}
  .music-btn{width:38px;height:38px;font-size:1rem;bottom:15px;left:15px}
}
@media(max-width:380px){
  .bg-text{font-size:110px}
  .envelope-svg{width:230px}
  .letter-content{padding:18px 16px 30px}
  .top-section h1{font-size:.8rem}
}
</style>
</head>
<body>

<div class="bg-text"><span>Be</span><span>my</span><span>Val.</span></div>

<svg class="thread" style="top:35%;left:-5%;width:115%;height:60%" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M-50 350 Q200 100 400 300 Q600 500 800 200 Q1000 -50 1250 250" stroke="#b5523a" stroke-width="1.8" fill="none" opacity=".2"/>
</svg>
<svg class="thread" style="top:50%;left:0;width:110%;height:40%" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M-30 50 Q300 350 600 100 Q900 -100 1230 200" stroke="#b5523a" stroke-width="1.2" fill="none" opacity=".12"/>
</svg>

<div class="top-section">
  <h1><span class="red">LOST</span>&nbsp; ACCESS</h1>
</div>

<div class="envelope-scene" id="envBtn" onclick="openLetter()">
  <svg class="envelope-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="200" cy="290" rx="160" ry="10" fill="rgba(0,0,0,.08)"/>
    <rect x="40" y="80" width="320" height="200" rx="12" fill="url(#envBody)"/>
    <polygon points="40,280 200,190 360,280" fill="url(#envBottom)" opacity=".9"/>
    <g>
      <rect x="75" y="50" width="250" height="180" rx="4" fill="#fff" stroke="#e8ddd5" stroke-width="1"/>
      <text x="200" y="110" font-family="'Playfair Display',serif" font-size="14" font-weight="600" fill="#c0392b" text-anchor="middle" font-style="italic">Lost access</text>
      <line x1="140" y1="125" x2="260" y2="125" stroke="#e0d5cc" stroke-width=".8"/>
    </g>
    <polygon points="40,80 200,195 360,80" fill="url(#envFlap)"/>
    <line x1="40" y1="80" x2="200" y2="195" stroke="rgba(0,0,0,.06)" stroke-width="1"/>
    <line x1="360" y1="80" x2="200" y2="195" stroke="rgba(0,0,0,.06)" stroke-width="1"/>
    <circle cx="200" cy="218" r="22" fill="url(#waxGrad)"/>
    <circle cx="200" cy="218" r="18" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
    <circle cx="200" cy="218" r="14" fill="none" stroke="rgba(255,255,255,.05)" stroke-width=".5"/>
    <path d="M200 212 Q200 208 196 208 Q192 208 192 212 Q192 216 200 222 Q208 216 208 212 Q208 208 204 208 Q200 208 200 212Z" fill="rgba(255,255,255,.35)"/>
    <path d="M20 200 Q100 170 200 218 Q300 265 380 235" stroke="#a04530" stroke-width="1.5" fill="none" opacity=".5"/>
    <path d="M380 235 Q390 232 395 240" stroke="#a04530" stroke-width="1.2" fill="none" opacity=".4"/>
    <defs>
      <linearGradient id="envBody" x1="0" y1="0" x2=".8" y2="1">
        <stop offset="0%" stop-color="#d94535"/><stop offset="50%" stop-color="#c0392b"/><stop offset="100%" stop-color="#a22a1f"/>
      </linearGradient>
      <linearGradient id="envFlap" x1=".5" y1="0" x2=".5" y2="1">
        <stop offset="0%" stop-color="#e04838"/><stop offset="100%" stop-color="#c43028"/>
      </linearGradient>
      <linearGradient id="envBottom" x1=".5" y1="0" x2=".5" y2="1">
        <stop offset="0%" stop-color="#b52a20"/><stop offset="100%" stop-color="#a82218"/>
      </linearGradient>
      <radialGradient id="waxGrad" cx=".4" cy=".35">
        <stop offset="0%" stop-color="#d4432e"/><stop offset="100%" stop-color="#6e1510"/>
      </radialGradient>
    </defs>
  </svg>
</div>

<div class="env-shadow"></div>
<p class="hint">with love FOREVER HK &#9829;</p>

<audio id="bgMusic" loop preload="auto">
  <source src="song.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn" class="music-btn" onclick="toggleMusic()" style="display:none">
  <span id="musicIcon">&#9835;</span>
</button>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeLetter()">
  <div class="letter">
    <button class="close" onclick="closeLetter()">&times;</button>
    <div class="letter-tape"></div>

    <svg class="doodle" style="top:8px;right:50px;width:40px" viewBox="0 0 40 20"><text x="0" y="14" font-size="12" fill="#c0392b" opacity=".6">&#9829;&#9829;</text></svg>
    <svg class="doodle" style="top:60px;right:25px;width:20px" viewBox="0 0 20 20"><text x="0" y="14" font-size="10" fill="#e8a0a0" opacity=".5">&#10022;</text></svg>
    <svg class="doodle" style="bottom:120px;left:20px;width:25px" viewBox="0 0 25 25"><text x="0" y="18" font-size="14" fill="#c0392b" opacity=".35">&#9829;</text></svg>
    <svg class="doodle" style="bottom:80px;right:30px;width:20px" viewBox="0 0 20 20"><text x="0" y="14" font-size="11" fill="#d4956a" opacity=".45">&#10022;</text></svg>

    <div class="letter-content" style="display:flex;align-items:center;justify-content:center;min-height:350px;flex-direction:column">
      <div style="text-align:center">
        <div style="font-size:1rem;color:#c0392b;margin-bottom:25px">&#9829;</div>
        <div style="font-family:'Playfair Display',serif;font-size:clamp(1.3rem,3.5vw,1.8rem);font-weight:700;color:#3a1c1c;letter-spacing:3px;text-transform:uppercase;line-height:1.6;margin-bottom:20px">
          FOR THE FINAL ACT OF LOVE
        </div>
        <div style="width:50px;height:1.5px;background:#d4a0a0;margin:0 auto 20px"></div>
        <div style="font-family:'Playfair Display',serif;font-size:clamp(1rem,2.5vw,1.3rem);font-weight:400;color:#5a3a3a;letter-spacing:2px;text-transform:uppercase;line-height:1.8;font-style:italic">
          WITH ALL THE COURAGE<br>I CHOOSE TO LET YOU GO
        </div>
        <div style="font-size:.85rem;color:#c0392b;margin-top:25px">&#9829;</div>
      </div>
    </div>
  </div>
</div>

<script>
let musicPlaying=false;
const music=document.getElementById('bgMusic');
const musicBtn=document.getElementById('musicBtn');
const musicIcon=document.getElementById('musicIcon');

function openLetter(){
  document.getElementById('overlay').classList.add('show');
  if(!musicPlaying){
    music.play().then(function(){
      musicPlaying=true;
      musicBtn.style.display='flex';
      musicIcon.textContent='\u266B';
      musicBtn.classList.remove('paused');
    }).catch(function(){
      musicBtn.style.display='flex';
      musicIcon.textContent='\u266A';
      musicBtn.classList.add('paused');
    });
  }
}
function closeLetter(){
  document.getElementById('overlay').classList.remove('show');
}
function toggleMusic(){
  if(musicPlaying){
    music.pause();musicPlaying=false;
    musicIcon.textContent='\u266A';
    musicBtn.classList.add('paused');
  }else{
    music.play();musicPlaying=true;
    musicIcon.textContent='\u266B';
    musicBtn.classList.remove('paused');
  }
}
</script>
</body>
</html>
